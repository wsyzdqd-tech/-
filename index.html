<style>
:root{

  --ink:#1a1518;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--pink-bg);color:var(--ink)}
body{

}
button{font:inherit}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--pink-bg)}

}
.top-title{font-size:19px;font-weight:500;letter-spacing:.02em}

}
.top-left{left:14px;padding:0 8px;font-size:29px;font-weight:300}
.top-right{right:15px;padding:0 5px;font-size:17px;letter-spacing:.1em}

.quiz{padding:22px 52px 80px;min-height:calc(100vh - 76px)}
.progress{height:6px;background:#eadfe5;border-radius:99px;overflow:hidden;margin-top:2px}
.progress>i{display:block;height:100%;background:var(--rose);width:0;transition:width .2s ease}

.meta{

}
.answer-wrap{min-height:245px}

.scale{
  padding:0 4px;
}
.scale-line{
  height:2px;background:#e2cfd7;position:relative;
}
.points{
  display:grid;grid-template-columns:repeat(5,1fr);position:relative;top:-23px;
}
.point{
  width:49px;height:49px;border-radius:50%;background:#fff;border:3px solid #d3d0d1;
  justify-self:center;cursor:pointer;transition:.16s ease;
}
.point.mid{width:41px;height:41px;margin-top:4px}
.point.active{
  border-color:var(--rose);background:#fff4f6;
  box-shadow:0 0 0 6px rgba(185,65,92,.08);
}
.point:hover{transform:scale(1.04)}
.scale-labels{display:flex;justify-content:space-between;margin-top:13px;font-size:16px;color:#998b91}
.scale-labels strong{font-weight:600;color:var(--rose)}

.choices{display:grid;gap:12px;margin-top:3px}
.choice{
  width:100%;text-align:left;padding:16px 17px;border:1px solid #ded3d8;
  border-radius:14px;background:rgba(255,255,255,.84);cursor:pointer;
  transition:.15s ease;
}
.choice:hover{border-color:#c6b5bd;transform:translateY(-1px)}
.choice.active{border-color:var(--rose);background:#fff0f3;box-shadow:0 10px 24px rgba(185,65,92,.06)}
.choice .lead{font-weight:700;font-size:15px;margin-bottom:5px}
.choice .desc{font-size:13px;color:#83757d;line-height:1.55}

.nav-row{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-top:34px}
.back-bottom{height:66px;border:1px solid #d9cbd1;background:#fff;color:#5c4b53;font-size:18px;font-weight:700;cursor:pointer}

.next{

  background:#1d1518;color:#fff;font-size:20px;font-weight:700;cursor:pointer;
}
.next:disabled{opacity:.38;cursor:not-allowed}
.hint{text-align:center;margin-top:13px;color:#a08f97;font-size:12px}

.result{

.result-inner{max-width:690px;margin:0 auto}
.kicker{text-align:center;color:#d291a2;font-family:Georgia,serif;font-size:14px;letter-spacing:.22em}
.result-title{

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.type-card{

}
.type-card.main{background:#51232d;border-color:#a56172}
.type-card small{display:block;color:#a99da1;font-size:12px;margin-bottom:24px}

.type-card h2{

.type-card.main h2{color:#f0a2b6}
.type-score{font-size:22px;color:#c8bdc1}
.type-gap{text-align:center;color:#aaa0a5;font-size:15px;margin:25px 0 45px}
.hr{height:1px;background:#36272c;margin:0 0 34px}
.s-title{font-size:22px;color:#ee9fb3;margin:0 0 6px}
.s-sub{color:#93878c;font-size:14px;margin-bottom:22px}

.radar-wrap{display:flex;justify-content:center}
.radar{width:100%;max-width:630px;height:auto}
.r-grid{fill:none;stroke:#57484d;stroke-width:1}
.r-axis{stroke:#493b40;stroke-width:1}
.r-area{fill:rgba(218,88,115,.19);stroke:#dc6682;stroke-width:3}
.r-label{fill:#f1e9eb;font-size:13px;font-weight:700}
.r-value{fill:#eea0b3;font-size:13px;font-weight:800}

.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 40px}
.top3 .item{background:#21191d;border:1px solid #49373c;padding:14px 10px;text-align:center}
.top3 span{display:block;color:#968a8e;font-size:11px;margin-bottom:6px}
.top3 b{font-size:15px}
.top3 em{display:block;font-style:normal;color:#eda2b6;margin-top:6px;font-size:13px}

.detail{border-top:1px solid #34272b;padding:22px 0}
.d-head{display:flex;justify-content:space-between;align-items:end;gap:12px}
.d-head h3{margin:0;font-size:19px}
.d-score{font-size:26px;font-weight:800}
.d-bar{height:8px;background:#2a2023;border-radius:99px;overflow:hidden;margin:11px 0 12px}

.detail p{margin:0;color:#b9adb2;line-height:1.85;font-size:14px}

.profile{

.profile h3{margin:0;color:#ee9fb3;font-size:18px}
.profile p{margin:10px 0 0;color:#c8bdc1;line-height:1.9;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}

.pay h3{margin:0 0 7px;font-size:20px}.pay p{margin:0;color:#d0c0c5;line-height:1.7;font-size:13px}
.price{font-size:30px;font-weight:900;margin:15px 0;color:#fff}
.pay-main{width:100%;height:53px;border:0;background:#e9a0b3;color:#24181c;font-weight:800;cursor:pointer}
.action-row{display:flex;gap:10px;margin-top:11px}

.foot{text-align:center;color:#776b70;font-size:11px;line-height:1.7;margin-top:25px}

.hidden{display:none!important}
@media(max-width:600px){

</style>
</head>

  ["C 主动结束冷战","不喜欢悬着，问题要处理。",{0:.8,7:1,6:.55}],
  ["D 表面冷静，内心戏很丰富","我可能不会追，但会想很多。",{8:.8,4:1,9:.55}]
 ]},
 {t:"c",q:"你对“谁掌握关系节奏”这件事更接近：",o:[
  ["A 我来定，效率最高","我喜欢知道下一步是什么。",{0:1,7:.55}],
  ["B 对方来定，我比较舒服","有人带着走反而轻松。",{1:1,5:.45}],
  ["C 谁更主动谁就多一点","我享受互动，不太固定。",{11:.8,6:.55,13:.35}],
  ["D 看当时谁更需要谁","关系里本来就会流动。",{12:.6,10:.45,13:.5}]
 ]},
 {t:"c",q:"你最想获得的关系体验是：",o:[
  ["A 被坚定地选择","我希望自己是特殊而确定的。",{5:1,10:.85,2:.65}],
  ["B 被理解和读懂","不用解释太多，对方就知道。",{12:1,5:.7}],
  ["C 被追逐、被挑战","有来有回才有意思。",{11:1,0:.4,6:.5}],
  ["D 被尊重边界，同时有心动感","亲密和自由最好同时存在。",{7:1,13:.8,4:.35}]
 ]}
];

const types=[
 ["S·主导型",{0:1.35,10:.45,6:.3,7:.15},"你天然擅长给关系定方向。你不一定强势，但你喜欢事情有节奏、有反馈、有人负责下一步。你的魅力更接近“确定感”。"],
 ["M·高顺从型",{1:1.35,5:.55,12:.3,0:-.15},"你更容易在被照顾、被引导、被明确对待时产生放松感。你并不是没有主见，而是当对方足够可靠时，你愿意把一部分控制权交出去。"],
 ["病娇感·高浓度型",{3:1.2,4:1.0,5:.75,2:.65,10:.35},"你的关系浓度很高。一旦认真，你很容易把注意力、情绪和安全感集中到一个人身上。这里的“病娇感”只是娱乐标签，指占有、敏感和高依恋的组合。"],
 ["反差魅惑型",{8:1.4,9:.45,12:.3,11:.25},"你的杀伤力来自“没想到”。平时越克制，关键时刻的温柔、锋利、主动或脆弱就越容易被放大。"],
 ["NDP感·聚光灯型",{10:1.35,0:.3,2:.45,8:.25},"你很在意自己在关系中的特殊位置，希望被注意、被认可、被看见。这里的标签只是描述较强的关注与特殊感需求。"],
 ["神秘高冷型",{9:1.4,13:.45,7:.3,6:.1},"你不太会一次性交出全部信息。你给人的空间很多，也正因为如此，别人常常会自己脑补、自己探索，于是你容易形成离开以后更想的后劲。"],
 ["暧昧高手型",{11:1.2,6:.75,8:.5,10:.25},"你对互动节奏、试探和气氛很敏感。你不一定喜欢承诺，但很会让一段关系在“差一点就更近”的位置保持张力。"],
 ["共情黏人型",{12:1.1,5:1.05,4:.55,3:.4},"你对别人细微的情绪变化很敏感，也更容易建立深度连接。你的魅力，是让人感觉自己被认真对待、被读懂了。"],
 ["松弛自由型",{13:1.35,7:.75,9:.45,5:-.15,3:-.2},"你很少把自己全部情绪都押在一段关系上。你有自己的节奏，所以反而容易制造一种和你相处没有压力的吸引力。"],
 ["双面危险型",{8:.9,11:.65,3:.6,0:.55,9:.35},"你不是单一方向的人：可以很松，也可以很强；可以很冷，也可以很黏。真正让人上头的是别人很难提前猜到你下一秒会切换成哪个版本。"]
];

function typeScore(s,w){let a=0,b=0;for(const k in w){a+=s[+k]*w[k];b+=Math.abs(w[k]);}return Math.max(0,Math.min(100,Math.round(a/Math.max(.1,b))))}

let idx=0, answers=Array(qs.length).fill(null), sums=Array(14).fill(0), weights=Array(14).fill(0);

function drawQuestion(){
  const q=qs[idx];
  metaQ.textContent=`QUESTION ${idx+1}`;
  metaN.textContent=`${idx+1} / ${qs.length}`;
  progressFill.style.width=`${((idx+1)/qs.length)*100}%`;
  question.textContent=q.q;
  answerArea.innerHTML="";
  nextBtn.disabled=answers[idx]===null;
  backBtn.classList.toggle("disabled",idx===0);
  backBottom.disabled=idx===0;

  if(q.t==="s"){
    const wrap=document.createElement("div");wrap.className="scale";
    const line=document.createElement("div");line.className="scale-line";wrap.appendChild(line);
    const points=document.createElement("div");points.className="points";
    for(let i=1;i<=5;i++){
      const b=document.createElement("button");b.className="point"+(i===3?" mid":"");
      if(answers[idx]===i)b.classList.add("active");
      b.onclick=()=>{answers[idx]=i;[...points.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");nextBtn.disabled=false};
      points.appendChild(b);
    }
    wrap.appendChild(points);
    const labs=document.createElement("div");labs.className="scale-labels";labs.innerHTML="<span>完全不像我</span><strong>非常像我</strong>";
    wrap.appendChild(labs);
    answerArea.appendChild(wrap);
  }else{
    const grid=document.createElement("div");grid.className="choices";
    q.o.forEach((o,i)=>{
      const b=document.createElement("button");b.className="choice";
      if(answers[idx]===i)b.classList.add("active");
      b.innerHTML=`<div class="lead">${o[0]}</div><div class="desc">${o[1]}</div>`;
      b.onclick=()=>{answers[idx]=i;[...grid.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");nextBtn.disabled=false};
      grid.appendChild(b);
    });
    answerArea.appendChild(grid);
  }
}
function recalc(){
  sums=Array(14).fill(0);weights=Array(14).fill(0);
  qs.forEach((q,i)=>{
    const a=answers[i];if(a===null)return;
    if(q.t==="s"){
      const x=(a-1)/4;
      for(const d in q.w){sums[+d]+=x*q.w[d];weights[+d]+=Math.abs(q.w[d])}
    }else{
      for(const d in Object.keys(q.o[a][2])){sums[+d]+=q.o[a][2][d];weights[+d]+=1}
    }
  })
}
function getScores(){recalc();return sums.map((x,i)=>Math.max(0,Math.min(100,Math.round(100*x/Math.max(.1,weights[i])))))}

nextBtn.onclick=()=>{
  if(answers[idx]===null)return;
  if(idx<qs.length-1){idx++;drawQuestion();window.scrollTo({top:0,behavior:"smooth"})}
  else showResults();
}
backBtn.onclick=()=>{
  if(idx>0){idx--;drawQuestion();window.scrollTo({top:0,behavior:"smooth"})}
};
backBottom.onclick=()=>{
  if(idx>0){idx--;drawQuestion();window.scrollTo({top:0,behavior:"smooth"})}
};

function showResults(){
  const s=getScores(), ranked=types.map((t,i)=>({i,v:typeScore(s,t[1])})).sort((a,b)=>b.v-a.v);
  mainType.textContent=types[ranked[0].i][0];mainScore.textContent=ranked[0].v+"分";
  secondType.textContent=types[ranked[1].i][0];secondScore.textContent=ranked[1].v+"分";
  typeGap.textContent=`核心类型与第二倾向的差异：${ranked[0].v-ranked[1].v} 分`;
  drawRadar(s);
  top3.innerHTML=s.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).slice(0,3).map((x,j)=>`<div class="item"><span>TOP ${j+1}</span><b>${dims[x.i].n}</b><em>${x.v}分</em></div>`).join("");
  details.innerHTML=s.map((v,i)=>{
    const level=v>=75?"很高":v>=55?"偏高":v>=40?"中等":"偏低";
    return `<div class="detail"><div class="d-head"><h3>${dims[i].n}</h3><div class="d-score">${v}</div></div>
    <div class="d-bar"><i style="width:${v}%"></i></div><p><strong style="color:#e7dde1">${level}</strong> · ${dims[i].d} ${note(i,v)}</p></div>`;
  }).join("");
  profileTitle.textContent=types[ranked[0].i][0]+" · 核心画像";profileText.textContent=types[ranked[0].i][2];
  const tags=["神秘感","反差感","关系主导","边界","高浓度","松弛感","暧昧张力","共情"];
  tags.sort(()=>Math.random()-.5);
  document.getElementById("tags").innerHTML=tags.slice(0,4).map(x=>`<span class="tag">${x}</span>`).join("");
  quizView.classList.add("hidden");resultView.classList.remove("hidden");backBtn.classList.add("disabled");
  window.scrollTo({top:0,behavior:"smooth"});
}
function note(i,v){
  const hi=["你更容易自然地站到带节奏的位置。","你对明确带领更容易产生放松和安全感。","你对“特殊位置”的需求比较明显。","关系里的微小变化更容易被你感知。","心动和不安都更容易被你放大。","稳定回应会明显提升你的安全感。","遇到喜欢的人，你更愿意把喜欢变成行动。","即使亲密，你也会比较在意自己的边界。","你的突然切换很容易制造“没想到”的效果。","你越慢慢打开，别人越容易产生探索欲。","被看见、被认可会明显增强你的投入感。","你对新鲜感、刺激和互动张力的接受度较高。","你比较容易捕捉别人情绪里的细节。","你与不确定相处时通常更自然。"];
  const lo=["你更习惯先观察，再决定是否主动。","你更习惯保留自己的主动权。","你不太容易把关系理解成占有。","你通常不会被单一的小信号牵着走。","你对关系波动的放大程度比较低。","你不太依赖高频确认来维持稳定。","除非信号明确，否则你不会轻易推进。","你比较容易守住个人空间。","你的表现通常比较一致，不需要靠反差吸引人。","你更偏向直接表达，而不是长期留白。","你更看重实际相处而不是外部认可。","你更喜欢稳定自然，不需要大量刺激。","你更关注事实，不容易被微小情绪牵着走。","你比多数人更想尽快知道答案。"];
  return v>=65?hi[i]:v<=35?lo[i]:"这一维度比较中性，会随着对象和场景变化。";
}
function drawRadar(s){
  const svg=document.getElementById("radar");svg.innerHTML="";
  const cx=320,cy=320,R=220,n=s.length,pts=(r)=>s.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]});
  for(const r of [.2,.4,.6,.8,1]){
    const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");poly.setAttribute("points",pts(r).map(p=>p.join(",")).join(" "));poly.setAttribute("class","r-grid");svg.appendChild(poly)
  }
  pts(1).forEach(p=>{const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",cx);l.setAttribute("y1",cy);l.setAttribute("x2",p[0]);l.setAttribute("y2",p[1]);l.setAttribute("class","r-axis");svg.appendChild(l)});
  const data=s.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/100;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]});
  const area=document.createElementNS("http://www.w3.org/2000/svg","polygon");area.setAttribute("points",data.map(p=>p.join(",")).join(" "));area.setAttribute("class","r-area");svg.appendChild(area);
  pts(1.18).forEach((p,i)=>{
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",p[0]);t.setAttribute("y",p[1]);t.setAttribute("text-anchor",p[0]<cx-20?"end":p[0]>cx+20?"start":"middle");t.setAttribute("dominant-baseline","middle");t.setAttribute("class","r-label");t.textContent=dims[i].n;svg.appendChild(t);
    const v=document.createElementNS("http://www.w3.org/2000/svg","text");v.setAttribute("x",p[0]);v.setAttribute("y",p[1]+17);v.setAttribute("text-anchor",p[0]<cx-20?"end":p[0]>cx+20?"start":"middle");v.setAttribute("class","r-value");v.textContent=s[i];svg.appendChild(v);
  })
}
document.getElementById("restartBtn").onclick=()=>location.reload();
document.getElementById("shareBtn").onclick=async()=>{
  const title=mainType.textContent;const text=`我的危险魅力是「${title}」｜来测测你的危险魅力`;
